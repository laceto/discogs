[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "discogs"
version = "0.1.0"
description = "A short description of Discogs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luigi Vinegar", email = "luigi.vinegar@gmail.com" }]

dependencies = [
    "requests>=2.31",
    "python3-discogs-client>=2.8",
    "python-dotenv>=1.0",
    "deepagents>=0.7",
    "langchain-openai>=1.7",
    "langgraph-checkpoint-sqlite>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "mypy",
    "ruff",
    "nbformat",
    "nbconvert",
    "ipykernel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "discogs_client.*"
ignore_missing_imports = true
